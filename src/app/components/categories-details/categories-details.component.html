<div class="container my-5">
  <!-- Loading State -->
  @if (isLoading) {
    <div class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p>Loading category details...</p>
    </div>
  }

  <!-- Brand Details - Using optional chaining -->
  @if (!isLoading && Category) {
    <div class="row">
      <div class="col-md-4">
        <img
          [src]="Category.image"
          loading="lazy"
          [alt]="Category.name"
          class="img-fluid rounded shadow"
        />
        <h1 class="my-2 text-center">{{ Category.name }}</h1>
      </div>
      <div class="col-md-8">
        <h2 class="mb-3">{{ Category.name }}</h2>
        <p class="text-muted"><strong>Slug:</strong> {{ Category.slug }}</p>
        <div class="row mt-4">
          <div class="col-6">
            <div class="card">
              <div class="card-body">
                <h6 class="card-subtitle mb-2 text-muted">Created At</h6>
                <p class="card-text">{{ Category.createdAt }}</p>
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="card">
              <div class="card-body">
                <h6 class="card-subtitle mb-2 text-muted">Updated At</h6>
                <p class="card-text">{{ Category.updatedAt }}</p>
              </div>
            </div>
          </div>
        </div>
        <!-- <button class="btn btn-secondary mt-4" (click)="goBack()">
          <i class="fas fa-arrow-left"></i> Back to Brands
        </button> -->
      </div>
    </div>
  }
</div>
