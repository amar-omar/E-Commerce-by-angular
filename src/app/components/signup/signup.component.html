<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="card shadow-lg border-0 rounded-4 p-4">
        <h2 class="text-center fw-bold mb-4">Create Account 🚀</h2>

        <form [formGroup]="register" (ngSubmit)="sendData()">

          <!-- Name -->
          <div class="mb-3">
            <input
              formControlName="name"
              type="text"
              class="form-control form-control-lg"
              [ngClass]="{
                'is-valid':
                  !register.get('name')?.errors &&
                  (register.get('name')?.touched ||
                    register.get('name')?.dirty),
                'is-invalid':
                  register.get('name')?.errors &&
                  (register.get('name')?.touched ||
                    register.get('name')?.dirty)
              }"
              placeholder="Enter your full name"
            />
            <app-alert
              [formName]="register"
              [controlName]="'name'"
            ></app-alert>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <input
              formControlName="email"
              type="email"
              class="form-control form-control-lg"
              placeholder="Enter your email"
            />
            <app-alert
              [formName]="register"
              [controlName]="'email'"
            ></app-alert>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <input
              formControlName="password"
              type="password"
              class="form-control form-control-lg"
              placeholder="Enter your password"
            />
            <app-alert
              [formName]="register"
              [controlName]="'password'"
            ></app-alert>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <input
              formControlName="rePassword"
              type="password"
              class="form-control form-control-lg"
              placeholder="Confirm your password"
            />
            <app-alert
              [formName]="register"
              [controlName]="'rePassword'"
            ></app-alert>
          </div>

          @if(errorMessage){
          <div class="alert alert-danger py-2">
            {{ errorMessage }}
          </div>
          }

          <button
            [disabled]="register.invalid || isBtnSubmit"
            class="btn bg-main text-white w-100 py-2"
          >
            @if (!isBtnSubmit) {
              Register
            } @else {
              <i class="fa-solid fa-spinner fa-spin"></i>
            }
          </button>

          <p class="text-center mt-4 mb-0 text-muted">
            Already have an account?
            <a
              routerLink="/login"
              class="text-decoration-none fw-semibold text-main"
            >
              Login
            </a>
          </p>

        </form>
      </div>
    </div>
  </div>
</div>
