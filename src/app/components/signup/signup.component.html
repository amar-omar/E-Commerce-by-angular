
<div class="m-auto w-50 my-5">
  <h1>Register Now :</h1>
  <form [formGroup]="register" (ngSubmit)="sendData()">
    <input
      [ngClass]="{
        'is-valid':
          !register.get('name')?.errors &&
          (register.get('name')?.touched || register.get('name')?.dirty),
        'is-invalid':
          register.get('name')?.errors &&
          (register.get('name')?.touched || register.get('name')?.dirty),
      }"
      formControlName="name"
      type="text"
      class="my-3 form-control"
      placeholder="Enter your name..."
    />
    <app-alert [formName]="register" [controlName]="'name'"></app-alert>
    <input
      formControlName="email"
      type="email"
      class="my-3 form-control"
      placeholder="Enter your email..."
    />
    <app-alert [formName]="register" [controlName]="'email'"></app-alert>
    <input
      formControlName="password"
      type="password"
      class="my-3 form-control"
      placeholder="Enter your password..."
    />
    <app-alert [formName]="register" [controlName]="'password'"></app-alert>

    <input
      formControlName="rePassword"
      type="password"
      class="my-3 form-control"
      placeholder="Confirm your password..."
    />
    <app-alert [formName]="register" controlName="rePassword"></app-alert>
    <div class=" text-danger my-3">{{ errorMessage }}</div>

    <button [disabled]="register.invalid || isBtnSubmit" class="bg-main text-white btn">
      @if (!isBtnSubmit) {
        Register
      } @else {
        <i class="fa-solid fa-spinner fa-spin"></i> 
      }
    </button>
  </form>
</div>
