<div class="m-auto w-50 my-5">
  <h1>Login Now :</h1>
  <form [formGroup]="loginForm" (ngSubmit)="sendData()">
    <input
      formControlName="email"
      type="email"
      class="my-3 form-control"
      placeholder="Enter your email..."
    />
    <app-alert [formName]="loginForm" [controlName]="'email'"></app-alert>
    <input
      formControlName="password"
      type="password"
      class="my-3 form-control"
      placeholder="Enter your password..."
    />
    <app-alert [formName]="loginForm" [controlName]="'password'"></app-alert>

    <div class="text-danger my-3">{{ errorMessage }}</div>
    <div class="d-flex justify-content-between">
      <button
        [disabled]="loginForm.invalid || isBtnSubmit"
        class="bg-main text-white btn"
      >
        @if (!isBtnSubmit) {
          Login
        } @else {
          <i class="fa-solid fa-spinner fa-spin"></i>
        }
      </button>
      <a routerLink="/forgot" class="link-primary">Forgot-Password?</a>
    </div>
  </form>
</div>
